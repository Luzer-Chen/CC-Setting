[package]
name = "cc-setting"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = "0.15"
tauri-plugin-updater = "2"
