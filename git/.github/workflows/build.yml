name: Build cc-setting

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run tauri build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-setting-macos
          path: src-tauri/target/release/bundle/macos/cc-setting.app
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-setting-windows
          path: src-tauri/target/release/bundle/nsis/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cc-setting-macos
          path: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cc-setting-windows
          path: windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: cc-setting ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            macos/cc-setting.app
            windows/cc-setting_*.exe
